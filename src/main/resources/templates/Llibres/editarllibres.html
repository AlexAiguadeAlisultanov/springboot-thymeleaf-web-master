<!DOCTYPE HTML>
<html lang="es" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: cap('titulo.libroEditar')}"></head>
<body>

<a class="salta" href="#contingut" th:text="#{nav.saltar}">Ve al contenido</a>
<header th:replace="~{fragments/base :: barra('llibres')}"></header>

<main class="pagina" id="contingut">
    <div class="ample">

        <a class="tornar" th:href="@{/llibres}">
            <svg class="ico-s" aria-hidden="true">
                <use href="#esquerra"></use>
            </svg>
            <span th:text="#{nav.libros}">Libros</span>
        </a>

        <div class="capcalera-seccio">
            <div>
                <div class="titol-amb-num">
                    <span class="num" aria-hidden="true">01</span>
                    <h1 class="titular titular-l" th:text="#{libros.editar.titulo}">Edita el libro</h1>
                </div>
                <p class="subtitol" th:text="${llibre.titol}">Título del libro</p>
            </div>
        </div>

        <div th:replace="~{fragments/formularis :: llibre(true)}"></div>

    </div>
</main>

<footer th:replace="~{fragments/base :: peu}"></footer>
</body>
</html>
