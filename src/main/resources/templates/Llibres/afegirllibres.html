<!DOCTYPE HTML>
<html lang="es" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: cap('titulo.libroNuevo')}"></head>
<body>

<a class="salta" href="#contingut" th:text="#{nav.saltar}">Ve al contenido</a>
<header th:replace="~{fragments/base :: barra('llibres')}"></header>

<main class="pagina pagina-estreta" id="contingut">

    <a class="tornar" th:href="@{/llibres}">
        <svg class="ico-s" aria-hidden="true">
            <use href="#esquerra"></use>
        </svg>
        <span th:text="#{nav.libros}">Libros</span>
    </a>

    <div class="capcalera">
        <div>
            <h1 th:text="#{libros.nuevo.titulo}">Nuevo libro</h1>
            <p class="subtitol" th:text="#{libros.nuevo.subtitulo}">Rellena la ficha y el libro aparecerá en
                el catálogo.</p>
        </div>
    </div>

    <div class="plafo">
        <div th:replace="~{fragments/formularis :: llibre(false)}"></div>
    </div>

</main>

<footer th:replace="~{fragments/base :: peu}"></footer>
</body>
</html>
