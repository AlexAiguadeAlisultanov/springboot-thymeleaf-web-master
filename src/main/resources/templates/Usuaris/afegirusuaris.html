<!DOCTYPE HTML>
<html lang="es" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: cap('titulo.usuarioNuevo')}"></head>
<body>

<a class="salta" href="#contingut" th:text="#{nav.saltar}">Ve al contenido</a>
<header th:replace="~{fragments/base :: barra('usuaris')}"></header>

<main class="pagina pagina-estreta" id="contingut">

    <a class="tornar" th:href="@{/usuaris}">
        <svg class="ico-s" aria-hidden="true">
            <use href="#esquerra"></use>
        </svg>
        <span th:text="#{nav.usuarios}">Usuarios</span>
    </a>

    <div class="capcalera">
        <div>
            <h1 th:text="#{usuarios.nuevo.titulo}">Nuevo usuario</h1>
            <p class="subtitol" th:text="#{usuarios.nuevo.subtitulo}">Con el DNI y una manera de contactar es
                suficiente.</p>
        </div>
    </div>

    <div class="plafo">
        <div th:replace="~{fragments/formularis :: usuari(false)}"></div>
    </div>

</main>

<footer th:replace="~{fragments/base :: peu}"></footer>
</body>
</html>
