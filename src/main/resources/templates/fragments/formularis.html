<!DOCTYPE HTML>
<html lang="es" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<!--
  Los formularios de alta y de edición comparten los mismos campos.
  El parámetro "edicio" solo cambia el texto del botón y bloquea la clave,
  porque cambiarla crearía un registro nuevo en lugar de actualizarlo.

  Los name de los campos no se tocan: los fija th:field a partir de la entidad.
-->
<body>

<form th:fragment="llibre(edicio)" class="formulari" action="/insertarllibres" method="post"
      th:object="${llibre}">

    <div class="camps">
        <div class="camp">
            <label for="titol" th:text="#{campo.titulo}">Título</label>
            <input type="text" id="titol" th:field="*{titol}" required autocomplete="off"
                   th:attr="placeholder=#{form.libro.ph.titulo}"/>
        </div>

        <div class="camp">
            <label for="autor" th:text="#{campo.autor}">Autor</label>
            <input type="text" id="autor" th:field="*{autor}" required autocomplete="off"
                   th:attr="placeholder=#{form.libro.ph.autor}"/>
        </div>

        <div class="camp">
            <label for="isbn" th:text="#{campo.isbn}">ISBN</label>
            <input type="text" id="isbn" th:field="*{isbn}" required autocomplete="off"
                   th:readonly="${edicio}" th:attr="placeholder=#{form.libro.ph.isbn}"/>
            <p class="pista" th:if="${edicio}" th:text="#{form.isbn.pista.edicion}">El ISBN identifica el
                libro y no se puede cambiar.</p>
            <p class="pista" th:unless="${edicio}" th:text="#{form.isbn.pista.alta}">Identifica el libro.</p>
        </div>

        <div class="camp">
            <label for="editorial" th:text="#{campo.editorial}">Editorial</label>
            <input type="text" id="editorial" th:field="*{editorial}" required autocomplete="off"
                   th:attr="placeholder=#{form.libro.ph.editorial}"/>
        </div>

        <div class="camp">
            <label for="categoria" th:text="#{campo.categoria}">Categoría</label>
            <input type="text" id="categoria" th:field="*{categoria}" required autocomplete="off"
                   th:attr="placeholder=#{form.libro.ph.categoria}"/>
        </div>

        <div class="camp">
            <label for="preu" th:text="#{campo.precio}">Precio</label>
            <input type="number" id="preu" th:field="*{preu}" required step="any" min="0"
                   autocomplete="off" th:attr="placeholder=#{form.libro.ph.precio}"/>
            <p class="pista" th:text="#{form.precio.pista}">En euros, con punto para los decimales.</p>
        </div>
    </div>

    <div class="accions-formulari">
        <button type="submit" class="boto boto-primari">
            <span th:if="${edicio}" th:text="#{boton.guardarCambios}">Guarda los cambios</span>
            <span th:unless="${edicio}" th:text="#{boton.guardarLibro}">Guarda el libro</span>
        </button>
        <a class="boto boto-pla" th:href="@{/llibres}" th:text="#{boton.cancelar}">Cancela</a>
    </div>
</form>


<form th:fragment="usuari(edicio)" class="formulari" action="/insertarusuari" method="post"
      th:object="${usuari}">

    <div class="camps">
        <div class="camp">
            <label for="nom" th:text="#{campo.nombre}">Nombre</label>
            <input type="text" id="nom" th:field="*{nom}" required autocomplete="off"
                   th:attr="placeholder=#{form.usuario.ph.nombre}"/>
        </div>

        <div class="camp">
            <label for="dni" th:text="#{campo.dni}">DNI</label>
            <input type="text" id="dni" th:field="*{dni}" required autocomplete="off"
                   th:readonly="${edicio}" th:attr="placeholder=#{form.usuario.ph.dni}"/>
            <p class="pista" th:if="${edicio}" th:text="#{form.dni.pista.edicion}">El DNI identifica la ficha
                y no se puede cambiar.</p>
        </div>

        <div class="camp">
            <label for="telefon" th:text="#{campo.telefono}">Teléfono</label>
            <input type="text" id="telefon" th:field="*{telefon}" required inputmode="numeric"
                   pattern="[0-9]{6,12}" autocomplete="off"
                   th:attr="placeholder=#{form.usuario.ph.telefono}"/>
            <p class="pista" th:text="#{form.telefono.pista}">Solo cifras, sin espacios ni prefijo.</p>
        </div>

        <div class="camp">
            <label for="correu" th:text="#{campo.correo}">Correo</label>
            <input type="email" id="correu" th:field="*{correu}" required autocomplete="off"
                   th:attr="placeholder=#{form.usuario.ph.correo}"/>
        </div>
    </div>

    <div class="accions-formulari">
        <button type="submit" class="boto boto-primari">
            <span th:if="${edicio}" th:text="#{boton.guardarCambios}">Guarda los cambios</span>
            <span th:unless="${edicio}" th:text="#{boton.guardarUsuario}">Guarda el usuario</span>
        </button>
        <a class="boto boto-pla" th:href="@{/usuaris}" th:text="#{boton.cancelar}">Cancela</a>
    </div>
</form>

</body>
</html>
