<!DOCTYPE HTML>
<html lang="es" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<!--
  Piezas compartidas por todas las pantallas: cabecera del documento,
  barra de navegación y pie. Así ninguna pantalla repite el mismo marcado.

  Los textos visibles salen de messages_*.properties. El fragmento "cap"
  recibe la clave del título, no el título escrito a mano.
-->
<head th:fragment="cap(clau)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
    <meta name="color-scheme" content="dark"/>
    <meta name="theme-color" content="#0B0B0A"/>
    <title th:text="#{${clau}} + ' · ' + #{app.nombre}">Biblioteca</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg}"/>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>

<header class="barra" th:fragment="barra(seccio)">

    <!-- Juego de iconos de toda la aplicación. Va aquí porque todas las pantallas
         incluyen esta cabecera y así ninguna lo repite. -->
    <svg class="sprite" aria-hidden="true" focusable="false">
        <symbol id="biblioteca" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="m16 6 4 14"/><path d="M12 6v14"/><path d="M8 8v12"/><path d="M4 4v16"/>
        </symbol>
        <symbol id="llibre" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 7v14"/>
            <path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>
        </symbol>
        <symbol id="usuaris" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </symbol>
        <symbol id="prestec" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 8v4l3 2"/>
            <circle cx="12" cy="12" r="10"/>
        </symbol>
        <symbol id="mes" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14"/><path d="M12 5v14"/>
        </symbol>
        <symbol id="editar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
            <path d="M18.4 2.6a2 2 0 0 1 3 3L12 15l-4 1 1-4z"/>
        </symbol>
        <symbol id="esborrar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18"/>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
            <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            <path d="M10 11v6"/><path d="M14 11v6"/>
        </symbol>
        <symbol id="cercar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <path d="m21 21-4.3-4.3"/>
        </symbol>
        <symbol id="dreta" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>
        </symbol>
        <symbol id="esquerra" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5"/><path d="m12 19-7-7 7-7"/>
        </symbol>
        <symbol id="avis" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 8v4"/><path d="M12 16h.01"/>
        </symbol>
        <symbol id="ordena" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="m6 9 6-6 6 6"/><path d="M12 3v18"/>
        </symbol>
        <symbol id="capsa" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 12h-6l-2 3h-4l-2-3H2"/>
            <path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>
        </symbol>
    </svg>

    <div class="barra-cos ample">
        <a class="marca" th:href="@{/}">
            <svg class="ico" aria-hidden="true">
                <use href="#biblioteca"></use>
            </svg>
            <span th:text="#{app.nombre}">Biblioteca</span>
        </a>

        <!-- Las secciones llevan su ordinal delante, el mismo que las numera en la
             portada, para que se lea como el índice de un libro. -->
        <nav class="navegacio" th:attr="aria-label=#{nav.secciones}">
            <a class="nav-enllac" th:href="@{/llibres}"
               th:attr="aria-current=${seccio == 'llibres'} ? 'page' : null">
                <span class="nav-ordinal" aria-hidden="true">01</span>
                <span th:text="#{nav.libros}">Libros</span>
            </a>
            <a class="nav-enllac" th:href="@{/usuaris}"
               th:attr="aria-current=${seccio == 'usuaris'} ? 'page' : null">
                <span class="nav-ordinal" aria-hidden="true">02</span>
                <span th:text="#{nav.usuarios}">Usuarios</span>
            </a>
        </nav>

        <!-- Selector de idioma. Cada enlace apunta a la misma página con otro
             valor de ?lang, así que la ruta se conserva sin JavaScript.
             Las banderas van dibujadas: Windows no pinta los emojis de bandera
             y la senyera ni siquiera existe como emoji. -->
        <nav class="idiomes" th:attr="aria-label=#{idioma.grupo}">
            <a class="idioma" href="?lang=es" hreflang="es" th:attr="title=#{idioma.es},
               aria-current=${#locale.language == 'es'} ? 'true' : null">
                <svg class="bandera" viewBox="0 0 30 20" aria-hidden="true" focusable="false">
                    <rect width="30" height="20" fill="#AA151B"/>
                    <rect y="5" width="30" height="10" fill="#F1BF00"/>
                </svg>
                <span aria-hidden="true">es</span>
                <span class="nomes-lector" th:text="#{idioma.es}">Castellano</span>
            </a>
            <a class="idioma" href="?lang=ca" hreflang="ca" th:attr="title=#{idioma.ca},
               aria-current=${#locale.language == 'ca'} ? 'true' : null">
                <svg class="bandera" viewBox="0 0 27 18" aria-hidden="true" focusable="false">
                    <rect width="27" height="18" fill="#FCDD09"/>
                    <rect y="2" width="27" height="2" fill="#DA121A"/>
                    <rect y="6" width="27" height="2" fill="#DA121A"/>
                    <rect y="10" width="27" height="2" fill="#DA121A"/>
                    <rect y="14" width="27" height="2" fill="#DA121A"/>
                </svg>
                <span aria-hidden="true">ca</span>
                <span class="nomes-lector" th:text="#{idioma.ca}">Català</span>
            </a>
            <a class="idioma" href="?lang=en" hreflang="en" th:attr="title=#{idioma.en},
               aria-current=${#locale.language == 'en'} ? 'true' : null">
                <svg class="bandera" viewBox="0 0 60 40" aria-hidden="true" focusable="false">
                    <clipPath id="quarts-uk">
                        <path d="M30,20 h30 v20 z v20 h-30 z h-30 v-20 z v-20 h30 z"/>
                    </clipPath>
                    <rect width="60" height="40" fill="#012169"/>
                    <path d="M0,0 L60,40 M60,0 L0,40" fill="none" stroke="#FFFFFF" stroke-width="8"/>
                    <path d="M0,0 L60,40 M60,0 L0,40" fill="none" stroke="#C8102E" stroke-width="5"
                          clip-path="url(#quarts-uk)"/>
                    <path d="M30,0 V40 M0,20 H60" fill="none" stroke="#FFFFFF" stroke-width="13"/>
                    <path d="M30,0 V40 M0,20 H60" fill="none" stroke="#C8102E" stroke-width="8"/>
                </svg>
                <span aria-hidden="true">en</span>
                <span class="nomes-lector" th:text="#{idioma.en}">English</span>
            </a>
        </nav>
    </div>
</header>

<footer class="peu" th:fragment="peu">
    <div class="peu-cos ample">
        <p th:text="#{app.pie}">Biblioteca. Catálogo de libros y usuarios.</p>
        <p th:text="#{app.pie.prestamos}">Préstamos, pendiente de hacer.</p>
    </div>
</footer>

</body>
</html>
