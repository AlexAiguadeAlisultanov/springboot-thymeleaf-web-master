# La conexion se lee del entorno. Lo que hay tras los dos puntos es el valor por
# defecto para arrancar en local: MYSQL_HOST, MYSQL_PORT, MYSQL_DB, MYSQL_USER,
# MYSQL_PASSWORD.

spring.jpa.hibernate.ddl-auto=none
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:biblioteca}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.jpa.show-sql: true

# Idioma de la interfaz
spring.messages.basename=messages
spring.messages.encoding=UTF-8
